<style>
  :root {
    --bg: #F4F1EC;
    --card: #FFFFFF;
    --primary: #2D6B4D;
    --primary-light: #E8F0EB;
    --primary-dark: #1B4832;
    --accent: #D4A853;
    --accent-light: #FFF8E8;
    --text: #2C2C2C;
    --text-light: #6B6B6B;
    --text-muted: #9B9B9B;
    --border: #E2DDD5;
    --user-bubble: #2D6B4D;
    --user-text: #FFFFFF;
    --bot-bubble: #FFFFFF;
    --bot-text: #2C2C2C;

  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Pretendard Variable', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: white;
    padding: 16px 20px;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -30px; right: -30px;
    width: 120px; height: 120px;
    background: rgba(255,255,255,0.06);
    border-radius: 50%;
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: -20px; left: 40%;
    width: 80px; height: 80px;
    background: rgba(255,255,255,0.04);
    border-radius: 50%;
  }
  .header-top {
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
    z-index: 1;
  }
  .header-icon {
    width: 44px; height: 44px;
    background: rgba(255,255,255,0.15);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;

  .header-title {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }
  .header-sub {
    font-size: 12px;
    opacity: 0.75;
    margin-top: 2px;
    font-weight: 400;
  }

    flex: 1;
    overflow-y: auto;
    padding: 16px 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }

  .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .msg { display: flex; gap: 8px; max-width: 88%; animation: msgIn 0.3s ease; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.bot { align-self: flex-start; }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-avatar {
    width: 32px; height: 32px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
    align-self: flex-end;

    line-height: 1.65;

    overflow-wrap: break-word;
    letter-spacing: -0.2px;

    background: var(--bot-bubble);
    color: var(--bot-text);
    border-bottom-left-radius: 6px;
    box-shadow: var(--shadow);
  }
  .user .msg-bubble {
    background: var(--user-bubble);
    color: var(--user-text);
    border-bottom-right-radius: 6px;
  }

  .msg-bubble strong { font-weight: 650; }
  .msg-bubble p { margin-bottom: 6px; }
  .msg-bubble p:last-child { margin-bottom: 0; }

  .typing { display: flex; gap: 4px; padding: 8px 0; align-items: center; }
  .typing span {
    width: 7px; height: 7px;
    background: var(--text-muted);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  .quick-replies {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 4px 0 8px;
    animation: msgIn 0.3s ease;
  }
  .quick-btn {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 13.5px;
    font-family: inherit;
    color: var(--primary);
    font-weight: 550;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .quick-btn:hover, .quick-btn:active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
    transform: scale(0.97);
  }

  /* Input area */
  .input-area {
    flex-shrink: 0;
    padding: 12px 16px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    background: var(--card);
    border-top: 1px solid var(--border);
  }
  .input-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  .input-row textarea {
    flex: 1;
    border: 1.5px solid var(--border);
    border-radius: 22px;
    padding: 10px 18px;
    font-size: 15px;
    font-family: inherit;
    resize: none;
    outline: none;
    line-height: 1.4;
    max-height: 100px;
    background: var(--bg);
    color: var(--text);
    transition: border-color 0.2s;
  }
  .input-row textarea::placeholder { color: var(--text-muted); }
  .input-row textarea:focus { border-color: var(--primary); }

    border-radius: 50%;
    background: var(--primary);
    color: white;
    font-size: 18px;
    cursor: pointer;

    align-items: center;
    justify-content: center;

</style>

const chatArea = document.getElementById('chatArea');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
let conversationHistory = [];
let isProcessing = false;

function addMessage(role, html) {
  const wrapper = document.createElement('div');
  wrapper.className = `msg ${role}`;

  if (role === 'bot') {
    wrapper.innerHTML = `<div class="msg-avatar">🏯</div><div class="msg-bubble">${html}</div>`;
  } else {
    wrapper.innerHTML = `<div class="msg-bubble">${html}</div>`;
  }

  chatArea.appendChild(wrapper);
  scrollToBottom();
}

function addQuickReplies(options) {
  const container = document.createElement('div');
  container.className = 'quick-replies';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'quick-btn';
    btn.textContent = opt;
    btn.onclick = () => {
      container.remove();
      handleSend(opt);
    };
    container.appendChild(btn);
  });
  chatArea.appendChild(container);
  scrollToBottom();
}

function showTyping() {
  const el = document.createElement('div');
  el.className = 'msg bot';
  el.id = 'typingIndicator';
  el.innerHTML = `<div class="msg-avatar">🏯</div><div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  chatArea.appendChild(el);
  scrollToBottom();
}

function removeTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

function scrollToBottom() {
  requestAnimationFrame(() => {
    chatArea.scrollTop = chatArea.scrollHeight;
  });
}

function formatResponse(text) {
  // Convert markdown-ish text to HTML
  let html = text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n\n/g, '</p><p>')
    .replace(/\n- /g, '<br>• ')
    .replace(/\n(\d+)\. /g, '<br>$1. ')
    .replace(/\n/g, '<br>');
  return `<p>${html}</p>`;
}

async function callAPI(messages) {
  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1000,
      system: SYSTEM_PROMPT,
      messages: messages
    })
  });

  if (!response.ok) {
    throw new Error(`API error: ${response.status}`);
  }

  const data = await response.json();
  return data.content.map(c => c.text || '').join('');
}

async function handleSend(overrideText) {
  const text = overrideText || userInput.value.trim();
  if (!text || isProcessing) return;

  isProcessing = true;
  if (!overrideText) userInput.value = '';
  userInput.style.height = 'auto';
  sendBtn.disabled = true;

  // Remove any existing quick replies
  document.querySelectorAll('.quick-replies').forEach(el => el.remove());

  addMessage('user', text.replace(/</g, '&lt;').replace(/>/g, '&gt;'));

  conversationHistory.push({ role: 'user', content: text });

  showTyping();

  try {
    const reply = await callAPI(conversationHistory);
    removeTyping();
    addMessage('bot', formatResponse(reply));
    conversationHistory.push({ role: 'assistant', content: reply });
  } catch (err) {
    removeTyping();
    console.error(err);
    addMessage('bot', '죄송합니다, 일시적인 오류가 발생했어요. 잠시 후 다시 시도해 주시거나, 행사 문의처 <strong>061-335-0986</strong>으로 전화해 주세요 📞');
  }

  isProcessing = false;
  sendBtn.disabled = !userInput.value.trim();
}

// Event listeners
sendBtn.addEventListener('click', () => handleSend());

userInput.addEventListener('input', () => {
  sendBtn.disabled = !userInput.value.trim() || isProcessing;
  // Auto-resize
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 100) + 'px';
});

userInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});

// Initialize
function init() {
  const welcomeHTML = `안녕하세요! 🏯<br><strong>나주읍성 문화대잔치</strong> 안내 챗봇이에요.<br><br>행사 일정, 프로그램, 오시는 길 등<br>궁금한 점을 편하게 물어봐 주세요!`;
  addMessage('bot', welcomeHTML);

  setTimeout(() => {
    addQuickReplies([
      '📅 전체 일정',
      '🎪 이번 주말 행사',
      '🚗 오시는 길',
      '🥁 체험 프로그램'
    ]);
  }, 400);
}

init();
</script>
