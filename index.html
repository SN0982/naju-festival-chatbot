<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>나주읍성 문화대잔치 안내 챗봇</title>
<style>
:root{--g:#00a77d;--d:#063f34;--m:#eef8f4;--l:#d7e5e2;--t:#223036}*{box-sizing:border-box}body{margin:0;font-family:Apple SD Gothic Neo,Noto Sans KR,system-ui,sans-serif;background:linear-gradient(#d8eef1,#fff);color:var(--t)}header,main,footer{width:min(920px,calc(100% - 24px));margin:auto}header{text-align:center;padding:34px 0 14px}.badge{display:inline-block;background:var(--g);color:#fff;border-radius:999px;padding:8px 14px;font-weight:800;font-size:13px}h1{margin:16px 0 8px;color:var(--g);font-size:clamp(34px,7vw,56px);line-height:1.05;letter-spacing:-.06em}header p{color:#667;margin:0;line-height:1.6}.guide{background:rgba(255,255,255,.78);border:1px solid var(--l);border-radius:22px;padding:18px;box-shadow:0 14px 36px rgba(5,107,85,.12)}.guide h2{margin:0 0 12px;color:var(--d)}.quick{display:flex;flex-wrap:wrap;gap:8px}.quick button,.chatinput button,.posterBtn,.close{border:0;border-radius:999px;font-weight:900;cursor:pointer}.quick button,.posterBtn{background:#fff;color:var(--d);border:1px solid var(--l);padding:10px 13px}.chatbox{margin-top:14px;background:#fff;border:1px solid var(--l);border-radius:24px;overflow:hidden;box-shadow:0 14px 36px rgba(5,107,85,.12)}.messages{height:66vh;min-height:430px;overflow:auto;padding:18px;background:#fbfefe;display:flex;flex-direction:column;gap:10px}.msg{max-width:92%;padding:13px 15px;border-radius:18px;line-height:1.65;white-space:pre-line}.bot{background:var(--m);align-self:flex-start}.user{background:var(--g);color:#fff;align-self:flex-end}.posterRow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.chatinput{display:flex;gap:8px;padding:12px;border-top:1px solid var(--l)}.chatinput input{flex:1;border:1px solid var(--l);border-radius:999px;padding:13px 16px;font-size:16px}.chatinput button{background:var(--g);color:#fff;padding:12px 16px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.open{display:flex}.panel{width:min(980px,100%);max-height:92vh;background:#fff;border-radius:22px;overflow:hidden;display:flex;flex-direction:column}.modalHead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--l)}.close{background:#edf4f2;padding:8px 12px}.stage{overflow:auto;padding:14px;background:#f7faf9}.stage img{display:block;max-width:100%;height:auto;margin:auto;border-radius:12px}#posterCaption{margin:0;padding:0 16px 16px;color:#667;line-height:1.6}footer{text-align:center;color:#688;padding:18px 0;font-size:13px}@media(max-width:640px){.messages{height:68vh}.msg{max-width:96%}}
</style>
</head>
<body>
<header>
  <div class="badge">나주읍성 생활권 단위 로컬브랜딩 활성화 사업</div>
  <h1>나주읍성 문화대잔치<br>안내 챗봇</h1>
  <p>일정·주차·전시·행사 포스터는 질문했을 때만 확인할 수 있습니다.</p>
</header>
<main>
  <section class="guide">
    <h2>궁금한 행사만 바로 물어보세요</h2>
    <div class="quick">
      <button onclick="ask('6월 일정 알려줘')">6월 일정</button>
      <button onclick="ask('문화대잔치 포스터 보여줘')">문화대잔치 포스터</button>
      <button onclick="ask('달빛산책 포스터 보여줘')">달빛산책 포스터</button>
      <button onclick="ask('첫만남센터 포스터 보여줘')">첫만남센터 포스터</button>
      <button onclick="ask('루마니아 전시 포스터 보여줘')">루마니아 전시 포스터</button>
      <button onclick="ask('주차 어디에 해?')">주차 안내</button>
    </div>
  </section>
  <section class="chatbox">
    <div id="messages" class="messages"><div class="msg bot">안녕하세요. 나주읍성 문화대잔치 안내 챗봇입니다.
“달빛산책 포스터”, “첫만남센터 개관식”, “루마니아 전시”, “6월 일정”, “주차”처럼 질문해 주세요.</div></div>
    <form class="chatinput" onsubmit="event.preventDefault();const q=document.getElementById('q');ask(q.value);q.value='';">
      <input id="q" placeholder="질문을 입력하세요" autocomplete="off"><button>전송</button>
    </form>
  </section>
</main>
<div id="modal" class="modal" onclick="if(event.target===this)closePoster()"><div class="panel"><div class="modalHead"><b id="posterTitle">포스터</b><button class="close" onclick="closePoster()">닫기</button></div><div class="stage"><img id="posterImage" alt="행사 포스터"></div><p id="posterCaption"></p></div></div>
<footer>나주시 · 나주문화재단 · 나주읍성마을관리사회적협동조합</footer>
<script>
const posters={festival:{title:'나주읍성 문화대잔치 종합 포스터',src:'posters/festival.png.png',cap:'행사 전체 일정과 주요 프로그램 안내 포스터입니다.'},moon:{title:'골목유람 달빛산책 포스터',src:'posters/moon-main.png.png',cap:'2026.6.27.(토) 19:30~21:30, 나빌레라문화센터 및 읍성권 골목 일대.'},moonProgram:{title:'달빛산책 프로그램 소개',src:'posters/moon-program.png.png',cap:'A조/B조 프로그램 시간과 달빛산책 동선 안내입니다.'},first:{title:'나주 첫만남센터 개관 포스터',src:'posters/firstmeet.png.jpg',cap:'2026.6.20.(토) 14:00, 나주첫만남센터 및 동헌터 일원.'},romania:{title:'나주, 루마니아를 품다 포스터',src:'posters/Romania.png.png',cap:'나주-루마니아 문화교류전. 2026.6.20.(토)~6.29.(월), 나주작은미술관.'}};
const rules=[
 {k:['달빛','산책'],t:'골목유람 <나주읍성 달빛산책>은 2026년 6월 27일(토) 19:30~21:30, 나빌레라문화센터 및 읍성권 골목 일대에서 진행됩니다.\n포스터와 프로그램 소개 이미지를 확인할 수 있습니다.',p:['moon','moonProgram']},
 {k:['첫만남'],t:'나주 첫만남센터 개관식은 2026년 6월 20일(토) 14:00, 나주첫만남센터 및 동헌터 일원에서 진행됩니다.',p:['first']},
 {k:['루마니아'],t:'「나주, 루마니아를 품다」는 나주-루마니아 문화교류전입니다.\n기간은 2026년 6월 20일(토)부터 6월 29일(월)까지이며, 장소는 나주작은미술관입니다.',p:['romania']},
 {k:['문화대잔치'],t:'나주읍성 문화대잔치 종합 포스터를 확인할 수 있습니다.',p:['festival']},
 {k:['6월'],t:'6월 주요 일정입니다.\n- 6.20.(토) 나주 첫만남센터 개관식\n- 6.20.(토) 수문장 교대의식·취타대\n- 6.20.(토)~6.21.(일) 나주읍성 도심캠핑\n- 6.27.(토) 골목유람 <나주읍성 달빛산책>',p:['festival','first','moon']},
 {k:['주차'],t:'행사장 주변 공영주차장은 금성관 옆, 나주신청문화관 앞, 남고문 인근, 세왕아파트 앞, 나주성당 인근 등을 이용할 수 있습니다. 현장 혼잡이 예상되니 여유 있게 이동해 주세요.',p:[]}
];
function norm(s){return(s||'').replace(/\s+/g,'')}
function add(text,type,plist=[]){const m=document.getElementById('messages');const b=document.createElement('div');b.className='msg '+type;b.textContent=text;m.appendChild(b);if(type==='bot'&&plist.length){const r=document.createElement('div');r.className='posterRow';plist.forEach(x=>{if(!posters[x])return;const btn=document.createElement('button');btn.className='posterBtn';btn.textContent=posters[x].title;btn.onclick=()=>openPoster(x);r.appendChild(btn)});b.appendChild(r)}m.scrollTop=m.scrollHeight}
function find(q){q=norm(q);let r=rules.find(x=>x.k.every(y=>q.includes(norm(y))))||rules.find(x=>x.k.some(y=>q.includes(norm(y))));return r||{t:'확인 가능한 안내입니다. “6월 일정”, “문화대잔치 포스터”, “달빛산책 포스터”, “첫만남센터 포스터”, “루마니아 전시 포스터”, “주차”처럼 질문해 주세요.',p:[]}}
function ask(q){if(!q||!q.trim())return;add(q,'user');const r=find(q);setTimeout(()=>add(r.t,'bot',r.p),120)}
function openPoster(k){const p=posters[k];document.getElementById('posterTitle').textContent=p.title;document.getElementById('posterImage').src=p.src;document.getElementById('posterCaption').textContent=p.cap;document.getElementById('modal').classList.add('open');document.body.style.overflow='hidden'}
function closePoster(){document.getElementById('modal').classList.remove('open');document.body.style.overflow=''}
</script>
</body>
</html>
