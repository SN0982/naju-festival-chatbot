function findBestMatch(input){const normalized=input.replace(/\s+/g,"").toLowerCase();let bestMatch=null;let bestScore=0;for(const qa of QA){let score=0;for(const kw of qa.keywords){const nkw=kw.replace(/\s+/g,"").toLowerCase();if(normalized.includes(nkw)){score+=nkw.length}}if(score>bestScore){bestScore=score;bestMatch=qa}}const btnMap={"📅 전체 일정":"overview","🎪 5월 축제 상세":"may_festival","🎪 이번 주말 행사":"may_festival","🚗 오시는 길":"transport","🥁 체험 프로그램":"programs","📍 장소별 안내":"venues","🅿️ 주차 안내":"parking","🛍️ 부대행사":"side_events","📞 문의처":"contact","🇫🇷 6월 행사":"june","🍂 9월 행사":"september","🎎 상시 프로그램":"always","👨‍👩‍👧‍👦 가족·어린이":"kids","🍜 먹거리":"food","🏕️ 도시캠핑":"camping","🏕️ 도심캠핑":"camping","💰 요금 안내":"free","📝 사전 접수 안내":"register","🎨 더시티 인 나주":"the_city"};if(btnMap[input]){bestMatch=QA.find(q=>q.id===btnMap[input]);bestScore=999}return bestScore>0?bestMatch:null}

const chatArea=document.getElementById("chatArea");const userInput=document.getElementById("userInput");const sendBtn=document.getElementById("sendBtn");
function addMessage(role,html){const w=document.createElement("div");w.className=`msg ${role}`;if(role==="bot"){w.innerHTML=`<div class="msg-avatar">🏯</div><div class="msg-bubble">${html}</div>`}else{w.innerHTML=`<div class="msg-bubble">${html}</div>`}chatArea.appendChild(w);scrollToBottom()}
function addQuickReplies(options){const c=document.createElement("div");c.className="quick-replies";options.forEach(opt=>{const b=document.createElement("button");b.className="quick-btn";b.textContent=opt;b.onclick=()=>{document.querySelectorAll(".quick-replies").forEach(el=>el.remove());handleSend(opt)};c.appendChild(b)});chatArea.appendChild(c);scrollToBottom()}
function showTyping(){const el=document.createElement("div");el.className="msg bot";el.id="typingIndicator";el.innerHTML=`<div class="msg-avatar">🏯</div><div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;chatArea.appendChild(el);scrollToBottom()}
function removeTyping(){const el=document.getElementById("typingIndicator");if(el)el.remove()}
function scrollToBottom(){requestAnimationFrame(()=>{chatArea.scrollTop=chatArea.scrollHeight})}
function handleSend(overrideText){const text=overrideText||userInput.value.trim();if(!text)return;if(!overrideText)userInput.value="";userInput.style.height="auto";sendBtn.disabled=true;document.querySelectorAll(".quick-replies").forEach(el=>el.remove());addMessage("user",text.replace(/</g,"&lt;").replace(/>/g,"&gt;"));showTyping();setTimeout(()=>{removeTyping();const match=findBestMatch(text);if(match){addMessage("bot",match.answer);if(match.followUp){setTimeout(()=>addQuickReplies(match.followUp),300)}}else{addMessage("bot",FALLBACK.answer);setTimeout(()=>addQuickReplies(FALLBACK.followUp),300)}},600)}
sendBtn.addEventListener("click",()=>handleSend());
userInput.addEventListener("input",()=>{sendBtn.disabled=!userInput.value.trim();userInput.style.height="auto";userInput.style.height=Math.min(userInput.scrollHeight,100)+"px"});
userInput.addEventListener("keydown",(e)=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();handleSend()}});
