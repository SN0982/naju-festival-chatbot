<style>

    --text-muted: #9B9B9B;
    --border: #E2DDD5;
    --user-bubble: #2D6B4D;

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {

    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: white;
    padding: 16px 20px;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';

    top: -30px; right: -30px;
    width: 120px; height: 120px;
    background: rgba(255,255,255,0.06);
    border-radius: 50%;

    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
    z-index: 1;
  }
  .header-icon {
    width: 44px; height: 44px;
    background: rgba(255,255,255,0.15);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    backdrop-filter: blur(4px);
  }
  .header-title {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }
  .header-sub {
    font-size: 12px;
    opacity: 0.75;
    margin-top: 2px;
    font-weight: 400;
  }

    flex: 1;
    overflow-y: auto;

    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }
  .chat-area::-webkit-scrollbar { width: 4px; }

  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.bot { align-self: flex-start; }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

    width: 32px; height: 32px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
    align-self: flex-end;
  }
  .bot .msg-avatar { background: var(--primary-light); }

  .msg-bubble {
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 14.5px;
    line-height: 1.7;
    word-break: keep-all;
    overflow-wrap: break-word;
    letter-spacing: -0.2px;
  }
  .bot .msg-bubble {
    background: var(--bot-bubble);
    color: var(--bot-text);
    border-bottom-left-radius: 6px;
    box-shadow: var(--shadow);
  }
  .user .msg-bubble {
    background: var(--user-bubble);
    color: var(--user-text);
    border-bottom-right-radius: 6px;
  }
  .msg-bubble strong { font-weight: 650; }

  .quick-replies {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 4px 0 8px;
    animation: msgIn 0.3s ease;
  }
  .quick-btn {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 13.5px;
    font-family: inherit;
    color: var(--primary);
    font-weight: 550;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .quick-btn:hover, .quick-btn:active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
    transform: scale(0.97);
  }

  .input-area {
    flex-shrink: 0;
    padding: 12px 16px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    background: var(--card);
    border-top: 1px solid var(--border);
  }
  .input-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  .input-row textarea {
    flex: 1;
    border: 1.5px solid var(--border);
    border-radius: 22px;
    padding: 10px 18px;
    font-size: 15px;
    font-family: inherit;
    resize: none;
    outline: none;
    line-height: 1.4;
    max-height: 100px;
    background: var(--bg);
    color: var(--text);
    transition: border-color 0.2s;
  }
  .input-row textarea::placeholder { color: var(--text-muted); }
  .input-row textarea:focus { border-color: var(--primary); }

  .send-btn {
    width: 42px; height: 42px;
    border: none;
    border-radius: 50%;
    background: var(--primary);
    color: white;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .send-btn:disabled { background: var(--border); cursor: default; }
  .send-btn:not(:disabled):hover { background: var(--primary-dark); transform: scale(1.05); }
  .send-btn svg { width: 20px; height: 20px; }

  .powered {
    text-align: center;
    font-size: 10.5px;
    color: var(--text-muted);
    padding: 4px 0 2px;
  }

  .typing span {
    width: 7px; height: 7px;
    background: var(--text-muted);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }
</style>

// ========== 매칭 로직 ==========
function findBestMatch(input) {
  const normalized = input.replace(/\s+/g, '').toLowerCase();
  let bestMatch = null;
  let bestScore = 0;

  for (const qa of QA) {
    let score = 0;
    for (const kw of qa.keywords) {
      const nkw = kw.replace(/\s+/g, '').toLowerCase();
      if (normalized.includes(nkw)) {
        score += nkw.length;
      }
    }
    if (score > bestScore) {
      bestScore = score;
      bestMatch = qa;
    }
  }

  // 퀵 버튼 매칭
  const btnMap = {
    '📅 전체 일정': 'overview',
    '🎪 5월 축제 상세': 'may_festival',
    '🎪 이번 주말 행사': 'may_festival',
    '🚗 오시는 길': 'transport',
    '🥁 체험 프로그램': 'programs',
    '📍 장소 안내': 'location',
    '🅿️ 주차 안내': 'parking',
    '🛍️ 부대행사': 'side_events',
    '📞 문의처': 'contact',
    '🇫🇷 6월 행사': 'june',
    '🍂 9월 행사': 'september',
    '🎎 상시 프로그램': 'always',
    '👨‍👩‍👧‍👦 가족·어린이': 'kids',
    '🍜 먹거리': 'food',
    '🏕️ 도시캠핑': 'camping',
    '💰 요금 안내': 'free',
  };

  if (btnMap[input]) {
    bestMatch = QA.find(q => q.id === btnMap[input]);
    bestScore = 999;
  }

  return bestScore > 0 ? bestMatch : null;
}

// ========== UI 로직 ==========
const chatArea = document.getElementById('chatArea');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');

function addMessage(role, html) {
  const wrapper = document.createElement('div');
  wrapper.className = `msg ${role}`;
  if (role === 'bot') {
    wrapper.innerHTML = `<div class="msg-avatar">🏯</div><div class="msg-bubble">${html}</div>`;
  } else {
    wrapper.innerHTML = `<div class="msg-bubble">${html}</div>`;
  }
  chatArea.appendChild(wrapper);
  scrollToBottom();
}

function addQuickReplies(options) {
  const container = document.createElement('div');
  container.className = 'quick-replies';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'quick-btn';
    btn.textContent = opt;
    btn.onclick = () => {
      document.querySelectorAll('.quick-replies').forEach(el => el.remove());
      handleSend(opt);
    };
    container.appendChild(btn);
  });
  chatArea.appendChild(container);
  scrollToBottom();
}

function showTyping() {
  const el = document.createElement('div');
  el.className = 'msg bot';
  el.id = 'typingIndicator';
  el.innerHTML = `<div class="msg-avatar">🏯</div><div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  chatArea.appendChild(el);
  scrollToBottom();
}

function removeTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

function scrollToBottom() {
  requestAnimationFrame(() => { chatArea.scrollTop = chatArea.scrollHeight; });
}

function handleSend(overrideText) {
  const text = overrideText || userInput.value.trim();
  if (!text) return;

  if (!overrideText) userInput.value = '';
  userInput.style.height = 'auto';
  sendBtn.disabled = true;

  document.querySelectorAll('.quick-replies').forEach(el => el.remove());
  addMessage('user', text.replace(/</g, '&lt;').replace(/>/g, '&gt;'));

  showTyping();

  setTimeout(() => {
    removeTyping();
    const match = findBestMatch(text);
    if (match) {
      addMessage('bot', match.answer);
      if (match.followUp) {
        setTimeout(() => addQuickReplies(match.followUp), 300);
      }
    } else {
      addMessage('bot', FALLBACK.answer);
      setTimeout(() => addQuickReplies(FALLBACK.followUp), 300);
    }
  }, 600);
}

sendBtn.addEventListener('click', () => handleSend());
userInput.addEventListener('input', () => {
  sendBtn.disabled = !userInput.value.trim();
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 100) + 'px';
});
userInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
});

  addMessage('bot', `안녕하세요! 🏯<br><strong>나주읍성 문화대잔치</strong> 안내 챗봇이에요.<br><br>아래 버튼을 누르거나, 궁금한 점을 입력해 주세요!`);

  }, 400);
}
