 {k:['6월'],t:'6월 주요 일정입니다.\n- 6.20.(토) 14:00~16:00 나주 첫만남센터 개관식\n- 6.20.(토) 14:00 / 17:30 수문장 교대의식·취타대\n- 6.20.(토)~6.21.(일) 나주읍성 도심캠핑\n- 6.27.(토) 16:00~18:00 첫만남 식탁-살롱 드 퀴진\n- 6.27.(토) 19:30~21:30 골목유람 <나주읍성 달빛산책>',p:['festival','first','moon']},

 {k:['첫만남','센터'],t:'나주 첫만남센터 개관식은 2026년 6월 20일(토) 14:00~16:00, 나주 첫만남센터 및 동헌터 일원에서 진행되었습니다.\n한불 수교 140주년 및 나주-프랑스 첫만남 175주년을 기념하는 개관 행사입니다.\n9월 19일에는 첫만남센터에서 벨에포크 프로그램과 밤마실 콘서트도 진행됩니다.',p:['first']},
 {k:['개관식'],t:'나주 첫만남센터 개관식은 2026년 6월 20일(토) 14:00~16:00, 나주 첫만남센터 및 동헌터 일원에서 진행되었습니다.\n관련 포스터를 함께 확인할 수 있습니다.',p:['first']},
 {k:['루마니아'],t:'「나주, 루마니아를 품다」는 나주-루마니아 문화교류전입니다.\n기간은 2026년 6월 20일(토)부터 6월 29일(월)까지이며, 장소는 나주작은미술관입니다.\n콘스탄틴 브랑쿠시전과 루마니아 민속 전통 관련 전시를 만나볼 수 있습니다.',p:['romania']},
 {k:['전시'],t:'전시 프로그램으로는 「나주, 루마니아를 품다」 나주-루마니아 문화교류전이 있습니다.\n기간은 2026.6.20.(토)~6.29.(월), 장소는 나주작은미술관입니다.\n루마니아 전시 포스터를 확인할 수 있습니다.',p:['romania']},
 {k:['취타대'],t:'취타대는 6월 수문장 교대의식과 함께 운영된 프로그램입니다.\n2026년 6월 20일(토) 14:00 1회차, 17:30 2회차로 나주 금성관 망화루에서 진행되었습니다.\n현재 제공된 9월 행사안내에는 취타대가 별도 프로그램으로 표기되어 있지 않습니다.',p:[]},

 {k:['인력거'],t:'인력거투어는 4월부터 10월까지 운영되는 상시 프로그램입니다.\n평일은 예약제, 주말은 상시 운영으로 안내되어 있습니다.',p:['festival']},

 {k:['전화'],t:'기존 포스터 기준 행사 문의 전화는 061-335-0968입니다. 9월 안내지에는 별도 문의 전화가 표기되어 있지 않아 최신 정보 여부는 확인이 필요합니다.',p:[]},

function norm(s){return(s||'').replace(/\s+/g,'')}
function add(text,type,plist=[]){const m=document.getElementById('messages');const b=document.createElement('div');b.className='msg '+type;b.textContent=text;m.appendChild(b);if(type==='bot'&&plist.length){const r=document.createElement('div');r.className='posterRow';plist.forEach(x=>{if(!posters[x])return;const btn=document.createElement('button');btn.className='posterBtn';btn.textContent=posters[x].title;btn.onclick=()=>openPoster(x);r.appendChild(btn)});b.appendChild(r)}m.scrollTop=m.scrollHeight}
function find(q){q=norm(q);let r=rules.find(x=>x.k.every(y=>q.includes(norm(y))))||rules.find(x=>x.k.some(y=>q.includes(norm(y))));return r||{t:'확인 가능한 안내입니다. “9월 일정”, “도심캠핑”, “수문장 교대의식”, “벨에포크”, “달빛산책”, “밤마실 콘서트”, “9월 신청”, “행사 장소”, “주차”, “상시 프로그램”, “문의처”처럼 질문해 주세요.',p:[]}}
function ask(q){if(!q||!q.trim())return;add(q,'user');const r=find(q);setTimeout(()=>add(r.t,'bot',r.p),120)}
function openPoster(k){const p=posters[k];document.getElementById('posterTitle').textContent=p.title;document.getElementById('posterImage').src=p.src;document.getElementById('posterCaption').textContent=p.cap;document.getElementById('modal').classList.add('open');document.body.style.overflow='hidden'}
function closePoster(){document.getElementById('modal').classList.remove('open');document.body.style.overflow=''}
</script>
